name: Build Locanear iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa / App)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Xcode Project & Create IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/App.app build/Payload/
          cd build
          zip -r Locanear.ipa Payload

      - name: Upload Build Artifacts (.ipa & .app)
        uses: actions/upload-artifact@v4
        with:
          name: Locanear-iOS-Build
          path: |
            ios/App/build/Locanear.ipa
            ios/App/build/Release-iphoneos/App.app
          if-no-files-found: warn
