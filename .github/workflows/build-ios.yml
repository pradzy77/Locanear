name: Build Locanear iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa / App)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Xcode Project & Create IPA
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

          APP_PATH=$(find derived_data/Build/Products -name "App.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          
          mkdir -p output/Payload
          cp -r "$APP_PATH" output/Payload/
          cd output
          zip -r Locanear.ipa Payload
          cd ..
          cp output/Locanear.ipa ./Locanear.ipa

      - name: Upload Build Artifacts (.ipa & .app)
        uses: actions/upload-artifact@v4
        with:
          name: Locanear-iOS-Build
          path: |
            ios/App/Locanear.ipa
            ios/App/output/Payload/App.app
          if-no-files-found: warn
